<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo — Harness Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>ToDo</h1>

    <form id="add-form">
      <label for="new-title">新しいタスク</label>
      <div class="row">
        <input id="new-title" type="text" autocomplete="off">
        <button type="submit" class="primary">追加</button>
      </div>
    </form>

    <div class="filters" role="group" aria-label="表示の絞り込み">
      <button type="button" data-filter="all" aria-pressed="true">すべて</button>
      <button type="button" data-filter="active" aria-pressed="false">未完了</button>
      <button type="button" data-filter="done" aria-pressed="false">完了</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" class="status" hidden>タスクがありません。</p>
    <p id="active-count" class="status" aria-live="polite"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
